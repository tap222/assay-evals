<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --page:#f4f5f8;--surface:#fff;--sunk:#eceef3;--line:#d8dbe4;--line-strong:#b9bdcb;
  --ink:#161a27;--ink-2:#3e4456;--muted:#646a7d;
  --accent:#3346a8;--accent-soft:#e6e9f8;--accent-ink:#24348a;
  --good:#2f6e56;--good-bg:#e2f2ea;--warn:#9a6512;--warn-bg:#fbf1dd;--bad:#b23b2e;--bad-bg:#fbe7e4;
  --band:rgba(51,70,168,.10);
  --c-ai:#3346a8;--c-est:#8f9be0;--c-fb:#c27c0e;--c-rev:#2f7d60;--c-rew:#85c2a6;--c-plat:#9097a8;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --page:#12141b;--surface:#1b1e28;--sunk:#171a23;--line:#2d3140;--line-strong:#454b5e;
  --ink:#e8eaf1;--ink-2:#c3c7d4;--muted:#9398aa;--accent:#8c9cf0;--accent-soft:#252b4a;--accent-ink:#b9c3f7;
  --good:#5fbf95;--good-bg:#183329;--warn:#e0a948;--warn-bg:#3a2c12;--bad:#ec8173;--bad-bg:#3d1f1b;
  --band:rgba(140,156,240,.14);
  --c-ai:#8c9cf0;--c-est:#4d5aa3;--c-fb:#e0a948;--c-rev:#5fbf95;--c-rew:#2f6e56;--c-plat:#6b7183}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:14.5px/1.5 var(--body)}
a{color:var(--accent-ink)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:baseline}
.brand b{font:600 22px var(--display)}
.brand span{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#12141b}}
button.link{border:0;background:none;padding:0;color:var(--accent-ink);text-decoration:underline;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav.tabs a{padding:10px 12px;color:var(--muted);font-weight:500;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .spacer{flex:1}
.viewswitch{display:none!important}
.settings-presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.preset-btn{padding:6px 12px;font-size:12.5px;font-weight:500;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);cursor:pointer;transition:all .15s}
.preset-btn:hover{border-color:var(--accent);background:var(--surface);color:var(--accent-ink)}
.settings-section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.settings-section-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.settings-section-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.tab-card{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;transition:all .15s;user-select:none}
.tab-card:hover{border-color:var(--line-strong)}
.tab-card.active{border-color:var(--accent);background:var(--accent-soft)}
.tab-card input{margin:3px 0 0;cursor:pointer}
.tab-card b{font-size:13.5px;display:flex;align-items:center;gap:6px}
.tab-card small{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.group-pills{display:flex;flex-wrap:wrap;gap:6px}
.group-pill{display:inline-flex;align-items:center;padding:5px 12px;border:1.5px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--surface);transition:all .15s;user-select:none}
.group-pill:hover{border-color:var(--line-strong)}
.group-pill.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.group-pill input{display:none}
nav.tabs .badge{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px}
h2{font:600 20px var(--display);margin:0}
h3{font:600 16px var(--display);margin:0}
.sub{color:var(--ink-2);margin:4px 0 0}
.ref{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mono{font-family:var(--mono)}
.stack{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}  /* the column fits the page: a chart can't size it */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
/* status strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.strip>div{padding:14px 16px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip b{display:block;font:600 28px var(--display);font-variant-numeric:tabular-nums;line-height:1.15}
.strip span{font-size:12.5px;color:var(--muted)}
.strip .bad b{color:var(--bad)}.strip .good b{color:var(--good)}.strip .warn b{color:var(--warn)}
@media (max-width:760px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(2){border-right:0}.strip>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
/* alert rows */
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.alert:last-child{border-bottom:0}
.alert .stripe{align-self:stretch;border-radius:2px;background:var(--bad)}
.alert.slo .stripe{background:var(--warn)}
.alert.resolved .stripe{background:var(--good)}
.alert.pending .stripe{background:var(--line-strong)}
.alert .msg{font-size:13.5px}
.alert .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;display:inline-block}
.chip.good{color:var(--good);background:var(--good-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}.chip.neutral{color:var(--muted);background:var(--sunk)}
.chip.new{color:#fff;background:var(--accent);margin-left:6px;font-size:9.5px;padding:1px 6px;vertical-align:middle}
.panel-sub{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}.panel-sub ul{list-style:none;padding:0;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.worse{color:var(--bad)}.better{color:var(--good)}.flat{color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
.scroll{overflow-x:auto}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:22px;color:var(--ink-2);background:var(--surface)}
code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
/* measure cards */
.group-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:grid;gap:6px;text-align:left;cursor:pointer;position:relative;align-content:start}
.card:hover{border-color:var(--line-strong)}
.card.alerting{border-color:var(--bad)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.val b{font:600 26px var(--display);font-variant-numeric:tabular-nums}
.val small{color:var(--muted);font-size:12px}
.trend{font-family:var(--mono);font-size:11.5px}
.reason{font-size:13px;color:var(--ink-2)}
svg.spark{width:100%;height:34px;display:block}
/* detail */
.detail-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg.chart{width:100%;height:auto;display:block}  /* with its own size (width, height, max-width): a browser can shrink it to fit, never blow it up */
svg.chart text{fill:var(--muted);font:11px var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;vertical-align:middle;margin-right:6px;border-radius:2px}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.dim h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bar-row{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;font-size:13px;padding:3px 4px;border-radius:5px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.bar-row:hover,.bar-row.sel{background:var(--sunk)}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-row:hover .track,.bar-row.sel .track{background:var(--page)}
.bar-row .fill{display:block;height:100%;background:var(--accent)}
.bar-row.breach .fill{background:var(--bad)}
.bar-row.small{opacity:.55}
.bar-row .num{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.bar-row.unrec .lbl{color:var(--warn)}
.note{font-size:12.5px;color:var(--muted)}
.slo-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.slo-form input{width:110px}
/* trace */
.flags{display:grid;gap:6px}
.flag{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.facts dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
svg.timeline text{fill:var(--ink-2);font:11px var(--mono)}
.keybox{display:flex;gap:8px;align-items:center}
.keybox a.button{background:var(--accent);color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;margin-right:12px}
button.linkish{background:none;border:none;padding:0;color:var(--accent-ink);text-decoration:underline}
svg.workflow{width:100%;height:auto;display:block}
svg.workflow .wnode{cursor:pointer}
svg.workflow .wnode:hover rect:first-child,svg.workflow .wnode:focus rect:first-child{filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
svg.workflow .wnode:focus{outline:none}
svg.workflow .wtitle{font:600 14px var(--body);fill:var(--ink)}
svg.workflow .wsub{font:10.5px var(--mono);fill:var(--muted)}
svg.workflow .wbadge{font:700 9.5px var(--mono);fill:var(--surface);letter-spacing:.04em}
svg.workflow .elabel{font:10.5px var(--mono);fill:var(--muted)}
svg.workflow .wbar{font:10.5px var(--mono);fill:var(--good)}
svg.workflow .wdia{font:700 12px var(--body);fill:var(--surface)}
svg.workflow .wdia2{font:9.5px var(--mono);fill:var(--surface);opacity:.9}
svg.workflow .whead{font:700 30px var(--display);fill:var(--ink);letter-spacing:-.01em}
svg.workflow .wlede{font:12px var(--mono);fill:var(--muted)}
svg.workflow .wlegend{font:11px var(--mono);fill:var(--ink-2)}
svg.workflow .etitle{font:700 14px var(--body);fill:var(--accent-ink)}
svg.workflow .edetail{font:10.5px var(--mono);fill:var(--ink-2)}
svg.workflow .egroup{font:11px var(--mono);fill:var(--c-fb)}
svg.workflow .ekind{font:600 9.5px var(--mono);fill:var(--c-fb);letter-spacing:.05em}
svg.workflow .ctitle{font:700 14px var(--body);fill:var(--ink)}
svg.workflow .ecard{cursor:default}
svg.workflow.linking .wnode:not(.hl),svg.workflow.linking .ecard:not(.hl){opacity:.28;transition:opacity .15s}
svg.workflow .ecard.hl rect:first-child{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
svg.workflow.compact .wtitle{font-size:12.5px}
svg.workflow.compact .wsub{font-size:9.5px}
svg.workflow.compact .wbadge{font-size:8.5px}
table.lineage th.hl,table.lineage td.hl{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.pathbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pathbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:12px var(--mono);cursor:pointer}
.pathbar button.err{border-color:var(--bad);color:var(--bad);font-weight:600}
.pathbar button.fail{background:var(--bad-bg);color:var(--bad)}
.pathbar button.noop{color:var(--muted);border-style:dashed}
.pathbar button.hl{box-shadow:0 0 0 2px var(--accent)}
.pathbar .arr{color:var(--muted)}
.pathbar button.viol{border:1.5px dashed var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.contract{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.contract:last-of-type{border-bottom:0}
.contract .msg{font-size:13.5px}
.contract .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
/* failure causes */
.kindbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.kindbar i{display:block;height:100%}
.cause{display:grid;grid-template-columns:5px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cause:last-child{border-bottom:0}
.cause .stripe{border-radius:3px}
.cause.decided{opacity:.62}
.cause h3{margin:4px 0 6px;font:600 16px var(--body)}
.cause ul{margin:6px 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.cause ul li{margin:2px 0}
.cause .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cause .head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cause .count{margin-left:auto;font:600 20px var(--display);font-variant-numeric:tabular-nums}
.cause .count small{font:12px var(--mono);color:var(--muted);margin-left:6px}
.feat{display:inline-block;font:11.5px var(--mono);background:var(--sunk);border-radius:5px;padding:2px 7px;margin:2px 4px 2px 0}
.cause .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}
.dots{font:13px var(--mono);letter-spacing:1px;white-space:nowrap}
.call{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.call .chip{font-size:12px;padding:4px 10px}
/* agents */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--sunk);border-radius:8px;padding:10px 12px}
.tile b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.traj{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.traj{grid-template-columns:1fr}}
.steps{display:grid;gap:6px}
.stp{display:grid;grid-template-columns:34px 70px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:13px}
.stp.matched{border-left-color:var(--good)}.stp.extra{border-left-color:var(--line)}
.stp.bad{border-left-color:var(--bad)}.stp.err{border-left-color:var(--warn)}
.stp.first{box-shadow:0 0 0 2px var(--bad);}
.stp.reason{opacity:.72}
.stp .n{font:11px var(--mono);color:var(--muted);padding-top:2px}
.stp .call{font:12.5px var(--mono);overflow-wrap:anywhere}
.stp .res{font:11.5px var(--mono);color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.stp .flag{margin-top:4px;font-size:12.5px}
.okx{font:600 13px var(--mono)}.okx.y{color:var(--good)}.okx.n{color:var(--bad)}
/* learn */
.loopbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.loopbar div{flex:1 1 120px;padding:10px 12px;border-right:1px solid var(--line);background:var(--surface)}
.loopbar div:last-child{border-right:0}
.loopbar b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.loopbar span{font-size:12px;color:var(--muted)}
.loopbar .arrow{flex:0 0 auto;padding:10px 4px;color:var(--muted);align-self:center;border:0;background:none}
.prov{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13px;align-items:baseline}
textarea.ref{width:100%;min-height:120px;font:12px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink)}
/* connect */
.checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.checklist div{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.checklist .ok{border-color:var(--good)}
.checklist .mark{font:600 15px var(--mono)}
.checklist .ok .mark{color:var(--good)}.checklist .no .mark{color:var(--muted)}
.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--good)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;font:inherit;color:inherit}
.choice:hover{border-color:var(--line-strong)}.choice.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.choice b{font-size:14.5px}.choice span{font-size:12.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.intg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.intg .card{cursor:default}
.intg input{width:100%}
.suggest{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
details summary{cursor:pointer}
.turn{border-left:3px solid var(--line);padding:4px 10px}.turn.user{border-color:var(--accent,#888)}.turn.tool pre{max-height:220px;overflow:auto}

@media (max-width:600px){main{padding:16px}header{padding:10px 16px}.bar-row{grid-template-columns:90px 1fr 100px}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Assay</b><span>Regression testing for AI apps and agents</span><div class="viewswitch" id="viewswitch" role="group" aria-label="View" hidden></div></div>
  <div class="controls">
    <select id="source" aria-label="Source"></select>
    <select id="days" aria-label="Window for manual runs"><option value="1" selected>Last 24 h</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option></select>
    <button id="run" class="primary" type="button">Run now</button>
    <span class="ref" id="updated"></span>
    <span id="me"></span>
  </div>
</header>
<main>
  <nav class="tabs" id="tabs" aria-label="Tabs"></nav>
  <div id="keybox" class="panel keybox" hidden>
    <a id="ssologin" class="button" href="/auth/login" hidden>Sign in with SSO</a>
    <label for="apikey">This server requires an API key:</label>
    <input id="apikey" type="password" autocomplete="off">
    <button id="savekey" type="button">Use key</button>
  </div>
  <section id="tab-overview" class="stack"></section>
  <section id="tab-summary" class="stack" hidden></section>
  <section id="tab-workflow" class="stack" hidden></section>
  <section id="tab-measures" class="stack" hidden></section>
  <section id="tab-cost" class="stack" hidden></section>
  <section id="tab-errors" class="stack" hidden></section>
  <section id="tab-failures" class="stack" hidden></section>
  <section id="tab-diff" class="stack" hidden></section>
  <section id="tab-agents" class="stack" hidden></section>
  <section id="tab-learn" class="stack" hidden></section>
  <section id="tab-review" class="stack" hidden></section>
  <section id="tab-prompts" class="stack" hidden></section>
  <section id="tab-trace" class="stack" hidden></section>
  <section id="tab-alerts" class="stack" hidden></section>
  <section id="tab-gates" class="stack" hidden></section>
  <section id="tab-connect" class="stack" hidden></section>
  <section id="tab-settings" class="stack" hidden></section>
  <section id="tab-projects" class="stack" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={catalog:{},groups:{},overview:null,latest:null,measure:null,dim:"",val:"",trace:{view:"slowest",segment:"",doc:null}};

const cookie=n=>(document.cookie.split("; ").find(c=>c.startsWith(n+"="))||"").slice(n.length+1);
async function api(path,opts={}){
  const key=store.get("assay-key");
  const headers={...(opts.headers||{}),...(key?{"Authorization":"Bearer "+key}:{})};
  if(opts.body)headers["Content-Type"]="application/json";
  if(!key&&cookie("assay_csrf"))headers["X-CSRF-Token"]=decodeURIComponent(cookie("assay_csrf"));  // a signed-in change
  const r=await fetch(path,{...opts,headers,credentials:"same-origin"});
  if(r.status===401){
    const c=await fetch("/auth/config").then(x=>x.json()).catch(()=>({}));
    if(c.sso){const a=$("#ssologin");a.hidden=false;a.href="/auth/login?next="+encodeURIComponent(location.pathname+location.search)}
    $("#keybox").hidden=false;throw new Error(c.sso?"Sign in to see this server.":"This server needs an API key with the read scope.")}
  if(r.status===429)throw new Error("Rate limit reached; wait a moment and try again.");
  if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(typeof b.detail==="string"?b.detail:r.statusText)}
  return r.json();
}
const src=()=>$("#source").value;
// A file from the API, sent with the key (a plain link wouldn't carry it).
async function download(path,name){
  const key=store.get("assay-key");
  const r=await fetch(path,{headers:key?{"Authorization":"Bearer "+key}:{}});
  if(!r.ok)return;
  const url=URL.createObjectURL(await r.blob()),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const q=o=>new URLSearchParams(Object.entries(o).filter(([,v])=>v!==""&&v!=null)).toString();

/* ---------- formatting ---------- */
function fmt(v,unit){
  if(v==null)return"—";
  switch(unit){
    case"ratio":return (v*100).toFixed(Math.abs(v)<0.01&&v!==0?2:1)+"%";
    case"seconds":return v<60?v.toFixed(v<10?1:0)+" s":v<3600?(v/60).toFixed(0)+" min":v<172800?(v/3600).toFixed(1)+" h":(v/86400).toFixed(1)+" d";
    case"ms":return v<10000?Math.round(v).toLocaleString()+" ms":(v/1000).toFixed(1)+" s";
    case"usd":return "$"+v.toFixed(2);
    case"count":return Math.round(v).toLocaleString();
    default:return v.toFixed(3);
  }
}
function ago(iso){if(!iso)return"";const s=(Date.now()-new Date(iso+"Z").getTime())/1000;
  if(s<90)return"just now";if(s<5400)return Math.round(s/60)+" min ago";if(s<129600)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}
// Local date and time, then how long ago: "Oct 9, 14:24 (2 d ago)".
function at(iso){return iso?new Date(iso+"Z").toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):""}
const when=iso=>iso?`${at(iso)} (${ago(iso)})`:"";
function dur(a,b){const s=(new Date((b||new Date().toISOString().slice(0,19))+"Z")-new Date(a+"Z"))/1000;return s<3600?Math.round(s/60)+" min":s<172800?(s/3600).toFixed(1)+" h":(s/86400).toFixed(1)+" d"}
const sliceName=(d,v)=>d?`${d.replace(/_/g," ")} = ${v}`:"overall";
function direction(m,delta){if(m.higher_is_better==null||Math.abs(delta)<1e-12)return"flat";return (delta>0)===m.higher_is_better?"better":"worse"}

/* ---------- charts ---------- */
function spark(points){
  const vals=points.map(p=>p.value).filter(v=>v!=null);if(vals.length<2)return"";
  const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,W=240,H=34,p=3;
  const pts=points.map((pt,i)=>pt.value==null?null:[p+i*(W-2*p)/(points.length-1),H-p-(pt.value-min)/span*(H-2*p)]).filter(Boolean);
  const d=pts.map((x,i)=>(i?"L":"M")+x[0].toFixed(1)+","+x[1].toFixed(1)).join(" "),last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]},${H} L${pts[0][0]},${H} Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function chart(h,m){
  const pts=h.points.filter(p=>p.value!=null);
  if(pts.length<2)return`<p class="note">Not enough history to draw yet. Each run adds a point.</p>`;
  const W=900,H=m.height||240,L=64,R=16,T=12,B=28;
  let lo=Math.min(...pts.map(p=>p.value)),hi=Math.max(...pts.map(p=>p.value));
  if(h.band){lo=Math.min(lo,h.band.low);hi=Math.max(hi,h.band.high)}
  if(h.slo){lo=Math.min(lo,h.slo.target);hi=Math.max(hi,h.slo.target)}
  if(m.unit==="ratio"||m.unit==="count"||m.unit==="ms"||m.unit==="seconds"||m.unit==="psi")lo=Math.max(0,lo);
  const pad=(hi-lo)*0.08||Math.abs(hi)*0.1||1;lo=Math.max(m.unit==="ratio"||m.unit==="count"?0:lo-pad,lo-pad);hi+=pad;
  if(m.unit==="ratio")hi=Math.min(hi,1);
  const t0=new Date(pts[0].at).getTime(),t1=new Date(pts[pts.length-1].at).getTime()||t0+1;
  const x=t=>L+(new Date(t).getTime()-t0)/((t1-t0)||1)*(W-L-R),y=v=>T+(1-(v-lo)/((hi-lo)||1))*(H-T-B);
  let g="";
  // One axis unit for every tick: switch ms to s, and seconds to hours, based on the top of the range.
  const axis=v=>m.unit==="ms"&&hi>=10000?(v/1000).toFixed(1)+" s":m.unit==="seconds"&&hi>=3600?(v/3600).toFixed(1)+" h":fmt(v,m.unit);
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${esc(axis(v))}</text>`}
  const ticks=Math.min(6,pts.length);for(let i=0;i<ticks;i++){const p=pts[Math.round(i*(pts.length-1)/(ticks-1||1))];g+=`<text x="${x(p.at)}" y="${H-8}" text-anchor="middle">${p.at.slice(5,10)}</text>`}
  if(h.band){const bx=x(pts[Math.max(0,pts.length-1-h.band.points)].at);g+=`<rect x="${bx}" y="${y(Math.min(h.band.high,hi))}" width="${W-R-bx}" height="${Math.max(0,y(Math.max(h.band.low,lo))-y(Math.min(h.band.high,hi)))}" fill="var(--band)"/>`}
  (h.changes||[]).forEach((c,i)=>{const t=new Date(c.at).getTime();if(t<t0||t>t1)return;const xx=x(c.at);
    g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" stroke="var(--next,#7a4fb0)" stroke-width="1.2" stroke-dasharray="3 3"><title>${esc(c.prompt_id)} ${esc(c.version)} went live${c.note?": "+esc(c.note):""}</title></line><text x="${xx>W-R-170?xx-4:xx+4}" text-anchor="${xx>W-R-170?"end":"start"}" y="${T+12+(i%3)*12}" style="fill:var(--accent-ink)">${esc(c.prompt_id)} ${esc(c.version)}</text>`});
  if(h.slo)g+=`<line x1="${L}" x2="${W-R}" y1="${y(h.slo.target)}" y2="${y(h.slo.target)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(h.slo.target)-5}" text-anchor="end" style="fill:var(--warn)">SLO ${esc(fmt(h.slo.target,m.unit))}</text>`;
  const d=pts.map((p,i)=>(i?"L":"M")+x(p.at).toFixed(1)+","+y(p.value).toFixed(1)).join(" ");
  g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  g+=pts.map((p,i)=>{const last=i===pts.length-1,out=last&&h.band&&(p.value<h.band.low||p.value>h.band.high);
    return `<circle cx="${x(p.at)}" cy="${y(p.value)}" r="${last?4.5:2.5}" fill="${out?"var(--bad)":"var(--accent)"}"><title>${esc(p.at.slice(0,16).replace("T"," "))} · ${esc(fmt(p.value,m.unit))} · n=${p.n}</title></circle>`}).join("");
  if(m.legend===false)return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:${W}px" role="img" aria-label="${esc(m.name)} over time">${g}</svg>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:${W}px" role="img" aria-label="${esc(m.name)} over time">${g}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>value per run</span>${h.band?`<span><i style="background:var(--band)"></i>expected range from the last ${h.band.points} runs</span>`:""}${h.slo?`<span><i style="border-top:2px dashed var(--warn);height:0"></i>SLO target</span>`:""}${(h.changes||[]).length?`<span><i style="border-top:2px dashed var(--accent-ink);height:0"></i>a prompt version went live</span>`:""}</div>`;
}

/* ---------- sources, refresh ---------- */
const DEMO_SOURCE="events:demo-agent";  // `assay demo`'s support agent: two test runs, the second regressed
const GUIDE="https://github.com/tap222/assay-evals/blob/main/docs/getting-started.md";
// Measure groups only document pipelines fill: the Documents view turns on by itself when one has data.
const DOC_GROUPS=["Accuracy (needs ground truth)","Document quality","Confidence"];
async function loadSources(){
  const s=await api("/v1/sources");
  const all=[...new Set([...s.configured,...s.with_results])];
  const keep=new URLSearchParams(location.search).get("source")||store.get("assay-source");  // ?source= for a link to one pipeline
  const pick=all.includes(keep)?keep:all.includes(DEMO_SOURCE)?DEMO_SOURCE:all[0];
  $("#source").innerHTML=all.length?all.map(x=>`<option ${x===pick?"selected":""}>${esc(x)}</option>`).join(""):`<option value="">No sources yet</option>`;
}
// A project that starts uploading while the page is open joins the menu by itself: the list is read
// again every 30 s while the tab is visible, and on coming back to it. The selection stays.
async function syncSources(){
  if(document.hidden)return;
  const s=await api("/v1/sources").catch(()=>null);if(!s)return;
  const sel=$("#source"),had=[...sel.options].map(o=>o.value).filter(Boolean);
  const fresh=[...new Set([...s.configured,...s.with_results])].filter(x=>!had.includes(x));
  if(!fresh.length)return;
  if(!had.length){await loadSources();await refresh();return}  // the menu said "No sources yet"
  fresh.forEach(x=>sel.add(new Option(x,x)));
}
setInterval(syncSources,30000);
document.addEventListener("visibilitychange",syncSources);
// The header's "Last run": the newer of the latest measure run and the latest test run.
async function showLastRun(){
  const s=src(),el=$("#updated");
  const test=s?await api(`/v1/evals/runs?${q({source:s})}`).then(r=>r[0]&&r[0].start).catch(()=>null):null;
  if(s!==src())return;
  const iso=[test,S.overview&&S.overview.run.started_at].filter(Boolean).sort().pop();
  el.textContent=iso?"Last run "+when(iso):s?"No runs yet":"";
}
async function refresh(){
  await loadViews();
  if(!src()){S.overview=null;showLastRun();buildNav();renderEmpty();return}
  try{S.overview=await api(`/v1/overview?${q({source:src()})}`)}catch(e){S.overview=null;S.latest=null;showLastRun();buildNav();renderEmpty(e.message);return}
  try{S.latest=await api(`/v1/runs/latest?${q({source:src()})}`)}catch(e){S.latest=null}
  S.alertCount=S.overview.open_alerts.length;buildNav();
  showLastRun();
  render();
}
function renderEmpty(msg){
  const html=src()?`<div class="empty">No runs yet for <b>${esc(src())}</b>. <a href="#connect">Open Connect</a> to see what its data can answer and backfill history, or press “Run now”.</div>`
    :`<div class="empty">${msg?esc(msg)+"<br><br>":""}Nothing connected yet. <a href="#connect">Connect your pipeline</a>, or load the demo with <code>python -m assay demo</code>.</div>`;
  ["summary","measures","cost","errors","prompts","trace","alerts"].forEach(t=>$("#tab-"+t).innerHTML=html);
  if(["overview","failures","diff","agents","learn","trace","workflow","gates","projects","connect","settings"].includes(tab()))render();  // drawn from events, no measure run needed
}

/* ---------- views, tabs and settings ---------- */
const NEW_TABS=["gates"];  // tabs with something added since the last release, tagged "New" in the nav
const TAB_INFO={overview:["Overview","The latest test run against the one before it"],diff:["Behavior diff","Any two test runs side by side"],
  failures:["Failures","Failures grouped into causes"],gates:["Release gates","Advance, hold or roll back, decided in CI"],
  prompts:["Prompts","Results for each prompt version"],agents:["Agents","Agent runs, step by step"],
  learn:["Learn","Production failures drafted into test cases"],review:["Review","Read production conversations and say what went wrong"],
  alerts:["Alerts","Open and resolved alerts"],summary:["Summary","What's broken in the pipeline right now"],
  workflow:["Pipeline","The pipeline as a graph, with each step's health"],measures:["Measures","Each measure over time, with SLOs"],
  cost:["Cost","Cost per document, by component and model"],errors:["Errors","Where reported wrong values start"],
  trace:["Trace","One document through every step"],projects:["All projects",""],connect:["Connect",""],settings:["Settings",""]};
const VIEW_INFO={agents:"Test runs, agent runs and production review.",documents:"A document pipeline's measures, cost and traces."};
const viewsKey=()=>"assay-views:"+src();
async function loadViews(){S.views=src()?await api(`/v1/views?${q({source:src()})}`).catch(()=>null):null}
// The team's settings, or this viewer's own where they can't change them (an open demo, a read-only key).
function viewsConfig(){
  const V=S.views;if(!V)return null;
  if(V.read_only){try{const own=JSON.parse(store.get(viewsKey())||"null");if(own)return own}catch(e){}}
  return V.config}
function hasDocs(){return !!S.latest&&Object.entries(S.latest.measures||{}).some(([id,m])=>m&&m.status==="measured"&&DOC_GROUPS.includes(S.catalog[id]?.group))}
function viewOn(name){const e=viewsConfig()?.views[name]?.enabled;return e==null?(name==="agents"||hasDocs()):e}
function enabledViews(){const on=["agents","documents"].filter(viewOn);return on.length?on:["agents"]}
function viewTabs(name){return viewsConfig()?.views[name]?.tabs||{agents:["overview","diff","failures","agents","alerts"],documents:["summary","workflow","measures","errors"]}[name]}
function currentView(){const on=enabledViews(),v=store.get("assay-view");return on.includes(v)?v:on[0]}
function allActiveTabs(){
  const c=viewsConfig();
  const set=new Set();
  const v=c?.views||{};
  if(v.agents?.enabled!==false && v.agents?.tabs){
    v.agents.tabs.forEach(t=>set.add(t));
  }
  if(v.documents?.enabled!==false && v.documents?.tabs){
    v.documents.tabs.forEach(t=>set.add(t));
  }
  if(!set.size){
    const defs=["overview","diff","failures","agents","alerts"];
    if(hasDocs())defs.push("summary","workflow","measures");
    return defs;
  }
  const ORDER=["overview","diff","failures","agents","gates","prompts","learn","review","summary","workflow","measures","cost","errors","trace","alerts"];
  const out=ORDER.filter(t=>set.has(t));
  return out.length?out:["overview","diff","failures","agents","alerts"];
}
function markTab(){const t=tab();document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function buildNav(){
  const tabs=allActiveTabs(),sw=$("#viewswitch");
  if(sw)sw.style.display="none";
  $("#tabs").innerHTML=[...tabs,"projects","connect","settings"].map(t=>`${t==="projects"?`<span class="spacer"></span>`:""}<a href="#${t}" data-tab="${t}">${esc(TAB_INFO[t]?.[0]||t)}${NEW_TABS.includes(t)?`<span class="chip new">New</span>`:""}${t==="alerts"?`<span class="badge" id="alert-badge"${S.alertCount?"":" hidden"}>${S.alertCount||""}</span>`:""}</a>`).join("");
  markTab();
}
function renderSettings(){
  const box=$("#tab-settings"),V=S.views;
  if(!V){box.innerHTML=`<div class="empty">Pick a source first.</div>`;return}
  const c=viewsConfig(),cat=V.catalog;
  const where=V.read_only?`<span class="chip warn">this browser</span><span>${esc(V.read_only)}</span>`
    :`<span class="chip good">everyone</span><span>Changes here apply to everyone who opens <b class="mono">${esc(src())}</b>.</span>`;

  const activeTabs=new Set(allActiveTabs());
  const activeGroups=new Set(c?.measure_groups||cat?.measure_groups||[]);

  const AGENT_TABS=["overview","diff","failures","agents","gates","prompts","learn","review","alerts"];
  const DOC_TABS=["summary","workflow","measures","cost","errors","trace"];

  const renderCard=t=>{
    const on=activeTabs.has(t);
    const info=TAB_INFO[t]||[t,""];
    const isNew=NEW_TABS.includes(t);
    return `<label class="tab-card${on?" active":""}" data-tab-card="${t}">
      <input type="checkbox" data-tab="${t}"${on?" checked":""}>
      <div>
        <b>${esc(info[0])}${isNew?`<span class="chip new">New</span>`:""}</b>
        <small>${esc(info[1])}</small>
      </div>
    </label>`;
  };

  const renderGroup=g=>{
    const on=activeGroups.has(g);
    return `<label class="group-pill${on?" active":""}">
      <input type="checkbox" data-group="${esc(g)}"${on?" checked":""}>
      <span>${esc(g)}</span>
    </label>`;
  };

  box.innerHTML=`<div class="panel stack">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
      <div>
        <h2>Dashboard Settings</h2>
        <p class="sub">Choose which tabs and measures appear on your dashboard. Single, unified navigation without nested menus.</p>
      </div>
      <div class="flag">${where}</div>
    </div>
    <div class="settings-presets">
      <span style="font-size:12.5px;color:var(--muted);font-weight:500">Presets:</span>
      <button type="button" class="preset-btn" data-preset="all">✨ All Features</button>
      <button type="button" class="preset-btn" data-preset="agents">🤖 Agent Testing</button>
      <button type="button" class="preset-btn" data-preset="pipeline">📊 Pipeline & Quality</button>
      <button type="button" class="preset-btn" data-preset="default">🎯 Defaults</button>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-head">
      <div>
        <h3>🤖 AI & Agent Testing</h3>
        <p class="sub">Trajectories, behavior diffs, failure clusters, release gates, and prompt iterations.</p>
      </div>
    </div>
    <div class="settings-grid">
      ${AGENT_TABS.map(renderCard).join("")}
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-head">
      <div>
        <h3>📊 Pipeline Observability & Tracing</h3>
        <p class="sub">Execution pipeline graphs, SLO measures, cost breakdowns, and document traces.</p>
      </div>
    </div>
    <div class="settings-grid">
      ${DOC_TABS.map(renderCard).join("")}
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-head">
      <div>
        <h3>📈 Measure Groups</h3>
        <p class="sub">Quality and reliability metrics computed over evaluation runs.</p>
      </div>
    </div>
    <div class="group-pills">
      ${(cat?.measure_groups||[]).map(renderGroup).join("")}
    </div>
  </div>

  <div class="row" style="display:flex;align-items:center;gap:12px;margin-top:6px">
    <button class="primary" type="button" id="views-save" style="font-weight:600;padding:8px 20px">Save Settings</button>
    <button type="button" id="views-reset" style="padding:8px 16px">Back to Defaults</button>
    <span class="note" id="views-msg" role="status" style="font-weight:500"></span>
  </div>`;

  box.querySelectorAll("input[data-tab]").forEach(inp=>{
    inp.onchange=()=>{inp.closest(".tab-card").classList.toggle("active",inp.checked)};
  });
  box.querySelectorAll("input[data-group]").forEach(inp=>{
    inp.onchange=()=>{inp.closest(".group-pill").classList.toggle("active",inp.checked)};
  });

  const setTabs=(tabList)=>{
    const set=new Set(tabList);
    box.querySelectorAll("input[data-tab]").forEach(inp=>{
      inp.checked=set.has(inp.dataset.tab);
      inp.closest(".tab-card").classList.toggle("active",inp.checked);
    });
  };
  box.querySelectorAll("[data-preset]").forEach(b=>{
    b.onclick=()=>{
      const p=b.dataset.preset;
      if(p==="all")setTabs([...AGENT_TABS,...DOC_TABS]);
      else if(p==="agents")setTabs(AGENT_TABS);
      else if(p==="pipeline")setTabs(DOC_TABS);
      else if(p==="default")setTabs([...(cat?.views?.agents?.core||[]),...(cat?.views?.documents?.core||[])]);
    };
  });

  const msg=t=>$("#views-msg").textContent=t;

  $("#views-save").onclick=async()=>{
    const checkedTabs=new Set([...box.querySelectorAll("input[data-tab]:checked")].map(i=>i.dataset.tab));
    const checkedGroups=[...box.querySelectorAll("input[data-group]:checked")].map(i=>i.dataset.group);

    if(!checkedTabs.size){msg("⚠️ Please select at least one tab to show.");return}

    const agTabs=(cat?.views?.agents?.tabs||AGENT_TABS).filter(t=>checkedTabs.has(t));
    const docTabs=(cat?.views?.documents?.tabs||DOC_TABS).filter(t=>checkedTabs.has(t));

    const cfg={
      views:{
        agents:{enabled:agTabs.length>0, tabs:agTabs.length?agTabs:(cat?.views?.agents?.core||[])},
        documents:{enabled:docTabs.length>0, tabs:docTabs.length?docTabs:(cat?.views?.documents?.core||[])}
      },
      measure_groups:checkedGroups
    };

    try{
      if(V.read_only){
        store.set(viewsKey(),JSON.stringify(cfg));
        msg("✓ Saved in this browser.");
      }else{
        S.views={...V,...await api("/v1/views",{method:"PUT",body:JSON.stringify({source:src(),config:cfg})})};
        msg("✓ Saved for everyone.");
      }
      buildNav();
    }catch(e){msg("Error: "+e.message)}
  };

  $("#views-reset").onclick=async()=>{
    try{
      if(V.read_only){
        try{localStorage.removeItem(viewsKey())}catch(e){}
      }else{
        S.views={...V,...await api(`/v1/views?${q({source:src()})}`,{method:"DELETE"})};
      }
      buildNav();
      renderSettings();
      msg("✓ Restored default settings.");
    }catch(e){msg("Error: "+e.message)}
  };
}

// Checks passed in each of the last 20 test runs: is it getting better or worse? Drawn into el.
async function trendChart(el,runs){
  runs=runs||await api(`/v1/evals/runs?${q({source:src()})}`).catch(()=>[]);
  const pts=runs.slice(0,20).reverse().filter(r=>r.results).map(r=>({at:r.start,value:r.passed/r.results,n:r.results,run:r.run_id}));
  if(pts.length<2||!el)return;
  el.innerHTML=`<h3 style="margin-bottom:6px">Checks passed, last ${pts.length} runs</h3>`+chart({points:pts},{unit:"ratio",name:"Checks passed",height:150,legend:false});

function alertRow(a,{actions=true}={}){
  const m=S.catalog[a.measure_id]||{name:a.measure_id};
  const since=a.state==="resolved"?`resolved ${ago(a.resolved_at)} · lasted ${dur(a.opened_at,a.resolved_at)}`:`${a.state==="pending"?"pending since":"open for"} ${dur(a.opened_at)} · last seen ${ago(a.last_seen_at)}`;
  return `<div class="alert ${a.kind} ${a.state}"><span class="stripe"></span>
    <div><div class="msg">${esc(a.message)}</div><div class="meta">${a.kind==="quality"?`Production quality: ${a.slice_value==="breach"?"breach":"investigate"}`:a.kind==="slo"?"SLO breach":a.kind==="regression"?`Prompt regression · <a href="#prompts">compare versions</a>`:a.kind==="contract"?"Path contract broken":"Anomaly"} · ${esc(since)}${a.n?` · n=${a.n}`:""}</div></div>
    ${!actions?"":a.kind==="quality"?`<a class="link" href="#learn">Investigate</a>`:a.kind==="contract"?`<a class="link" href="#workflow">Investigate</a>`:`<button class="link" type="button" data-open="${esc(a.measure_id)}" data-dim="${esc(a.dimension||"")}" data-val="${esc(a.slice_value||"")}">Investigate</button>`}</div>`;
}
// One line per measure and dimension, however many slices breach it.
function sloGroups(list){
  const groups={};list.forEach(a=>(groups[a.measure_id+"|"+(a.dimension||"")]??=[]).push(a));
  return Object.values(groups).map(g=>{
    if(g.length===1)return alertRow(g[0]);
    const m=S.catalog[g[0].measure_id],dim=g[0].dimension,worst=[...g].sort((a,b)=>m.higher_is_better?a.value-b.value:b.value-a.value);
    return `<div class="alert slo open"><span class="stripe"></span><div>
      <div class="msg">${esc(m.name)}: ${g.length} ${esc(dim.replace(/_/g," "))} slices breach the SLO of ${m.higher_is_better?"≥":"≤"} ${esc(fmt(g[0].target,m.unit))}.</div>
      <div class="meta">${worst.map(a=>`${esc(a.slice_value)} ${esc(fmt(a.value,m.unit))}`).join(" · ")}</div></div>
      <button class="link" type="button" data-open="${esc(m.id)}" data-dim="${esc(dim)}" data-val="${esc(worst[0].slice_value)}">Investigate</button></div>`}).join("");
}

function openAlertsFor(mid){return (S.overview?.open_alerts||[]).filter(a=>a.measure_id===mid)}
async function renderMeasureGrid(){
  const L=S.latest;if(!L){$("#tab-measures").innerHTML=`<div class="empty">No runs yet.</div>`;return}
  const on=viewsConfig()?.measure_groups,shown=Object.entries(S.groups).filter(([g])=>!on||on.includes(g));
  if(!shown.length){$("#tab-measures").innerHTML=`<div class="empty">No measures turned on. Pick the ones to show in <a href="#settings">Settings</a>.</div>`;return}
  const ids=shown.flatMap(([,ids])=>ids).filter(i=>S.catalog[i]);
  const hist=Object.fromEntries(await Promise.all(ids.map(async id=>[id,(await api(`/v1/measures/${id}/history?${q({source:src()})}`).catch(()=>({points:[]}))).points])));
  const card=id=>{
    const m=S.catalog[id],r=L.measures[id]||{status:"unmeasured",reason:"Not computed in this run."},on=r.status==="measured"&&r.overall;
    const al=openAlertsFor(id),slo=(S.overview?.slos||[]).filter(s=>s.measure_id===id);
    const pts=hist[id].filter(p=>p.value!=null);let tr="";
    if(on&&pts.length>1){const d=pts[pts.length-1].value-pts[pts.length-2].value,k=direction(m,d);tr=`<span class="trend ${k}">${k==="flat"?"no change":(d>0?"▲ ":"▼ ")+fmt(Math.abs(d),m.unit)} vs previous run</span>`}
    const chips=[al.length?`<span class="chip bad">${al.length} alert${al.length>1?"s":""}</span>`:"",

const COMP_COLOR={"ai_inference":"var(--c-ai)","ai_estimated":"var(--c-est)","fallback":"var(--c-fb)","review":"var(--c-rev)","rework":"var(--c-rew)","platform":"var(--c-plat)"};
const COMP_KEYS=["ai_inference","ai_estimated","fallback","review","rework","platform"];
const COMP_LABEL={"ai_inference":"AI inference","ai_estimated":"AI inference, estimated","fallback":"Fallback escalation","review":"Human review","rework":"Rework","platform":"Platform"};
function money(v){if(v==null)return"—";const a=Math.abs(v);return a>=1000?"$"+Math.round(v).toLocaleString():a>=10?"$"+v.toFixed(0):a>=1?"$"+v.toFixed(2):a>=0.01?"$"+v.toFixed(3):"$"+v.toFixed(4)}
function stackBar(per,total,max){
  return `<span class="costbar" style="width:${Math.max(2,total/max*100)}%">${COMP_KEYS.filter(k=>per[k]>0).map(k=>`<i style="width:${per[k]/total*100}%;background:${COMP_COLOR[k]}" title="${esc(COMP_LABEL[k])} ${esc(money(per[k]))}"></i>`).join("")}</span>`;
}
function stackedChart(series,points){
  // series: {key: [value per run]}, points: run timestamps
  const n=points.length;if(n<2)return`<p class="note">Not enough history yet.</p>`;
  const totals=points.map((_,i)=>COMP_KEYS.reduce((s,k)=>s+(series[k]?.[i]||0),0));
  // Round the axis to a 1/2/5 step so ticks read as $0.50, $1.00, ...
  const raw=Math.max(...totals)/4||1,mag=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw);
  const max=step*4,W=900,H=220,L=60,R=12,T=10,B=26,bw=(W-L-R)/n;
  const y=v=>T+(1-v/max)*(H-T-B);let g="";
  for(let i=0;i<=4;i++){const v=step*i,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${esc(money(v))}</text>`}
  points.forEach((at,i)=>{let base=0;const x=L+i*bw+bw*0.12,w=bw*0.76;
    COMP_KEYS.forEach(k=>{const v=series[k]?.[i]||0;if(!v)return;g+=`<rect x="${x}" y="${y(base+v)}" width="${w}" height="${y(base)-y(base+v)}" fill="${COMP_COLOR[k]}"><title>${esc(at.slice(0,10))} · ${esc(COMP_LABEL[k])} ${esc(money(v))}</title></rect>`;base+=v});
    const every=Math.ceil(n/7);
    if(i%every===0&&(n-1-i>=every/2||i===n-1)||i===n-1)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${at.slice(5,10)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:${W}px" role="img" aria-label="Cost per document by component over time">${g}</svg>`;
}

const VERDICT={introduced:["Introduced","var(--bad)","The first step to produce the field got it wrong, though the right value was in its input."],
  corrupted:["Corrupted","var(--c-fb)","Right after one step, changed to wrong by a later one."],
  dropped:["Dropped","var(--warn)","Right at one step, gone at a later one."],
  upstream:["Input / upstream","var(--c-est)","The right value never appears in any step's text: the source document or OCR."],
  caused_by:["Caused by an earlier error","var(--c-rew)","An earlier step's wrong decision (e.g. document type) made this step fail."],
  after:["After the pipeline","var(--c-plat)","Every step had it right; it went wrong in delivery, mapping or downstream."],
  unlocalized:["Not localized","var(--line-strong)","No step records this field. Send step outputs to trace it."]};

    <div class="msg"><b class="mono">${esc(r.field)}</b> ${r.kind==="missing"?"missing":r.kind==="extra"?"shouldn't exist":r.expected?`should be <b>${esc(r.expected)}</b>${r.observed!=null?`, was <b>${esc(r.observed)}</b>`:""}`:`is wrong${r.observed!=null?`: was <b>${esc(r.observed)}</b>`:""}`} ${vchip(r.verdict)} ${r.origin_stage?`at <b class="mono">${esc(r.origin_stage)}</b>`:""}${r.origin_prompt?` <span class="ref">prompt ${esc(r.origin_prompt)}</span>`:""}</div>

function flowSummary(g){

  const broken=g.nodes.filter(n=>(n.contract_violations||[]).length).map(n=>`<b>${esc(pretty(n.id))}</b> (${esc(n.contract_violations.map(v=>v.label).join("; "))})`);

  else parts.push("Every document takes the same path.");
  if(worst)parts.push(`Most reported errors start at <b>${esc(pretty(worst.id))}</b> (${worst.errors.toLocaleString()}).`);
  if(stubs.length)parts.push(`${stubs.join(" and ")} ${stubs.length===1?"reports":"report"} success on every document but ${stubs.length===1?"does":"do"} no work.`);
  if(broken.length)parts.push(`Path contracts are broken at ${broken.join(", ")}.`);

  const off=()=>{svg.classList.remove("linking");svg.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"))};

/* ---------- agents ---------- */
const MECH={unsafe_action:["Unsafe action","var(--bad)"],tool_error:["Tool error","var(--c-fb)"],looped:["Looped","var(--warn)"],
  wrong_tool:["Wrong tool","var(--c-ai)"],bad_arguments:["Wrong arguments","var(--c-est)"],gave_up:["Stopped early","var(--c-plat)"],
  ignored_result:["Ignored a tool result","var(--c-rew)"],wrong_state:["Wrong end state","var(--c-rev)"],wrong_answer:["Wrong answer","var(--line-strong)"]};
const CHECK_LABEL={answer:"Answer",end_state:"End state",tool_calls:"Tool calls",safety:"Safety",efficiency:"Efficiency",recorded:"Recorded checks"};
const jtxt=v=>v==null?"":typeof v==="string"?v:JSON.stringify(v);
const callTxt=(n,a)=>`${n}(${Object.entries(a||{}).map(([k,v])=>`${k}=${JSON.stringify(v)}`).join(", ")})`;
function delta(now,before,{pp=true,lowerBetter=false}={}){if(now==null||before==null)return"";const d=now-before;if(Math.abs(d)<1e-9)return`<span class="ref">no change</span>`;
  const worse=lowerBetter?d>0:d<0;return `<span class="${worse?"worse":"better"}">${d>0?"▲":"▼"} ${pp?(Math.abs(d)*100).toFixed(1)+" pts":before?Math.round(Math.abs(d/before)*100)+"%":Math.abs(d).toFixed(2)}</span>`}
const LIFE_CHECK={evaluation:"Couldn't evaluate",completed:"Finished",safety:"Safety",loops:"Loops",tool_errors:"Tool errors",answer:"Answer",
  end_state:"End state",tool_calls:"Tool calls",efficiency:"Efficiency"};
const lifeStatus=st=>`<span class="chip ${st==="completed"||st==null?"good":st==="running"?"neutral":st==="abandoned"?"warn":"bad"}">${esc(st||"completed")}</span>`;
// Every agent run, production or test: where it is in its lifecycle, and the latest that failed a check.
function lifecyclePanel(l){
  if(!l)return"";
  const tiles=[["Running",l.running,"not judged until they end"],["Awaiting evaluation",l.awaiting_evaluation,"ended, checked within a minute"],
    ["Evaluated",l.evaluated,"checked when they ended"],["Failing",l.failing,"of those evaluated"],["Abandoned",l.abandoned,`no events for ${l.abandon_minutes} min`]];
  const warn=[];
  if(l.oldest_awaiting_minutes!=null&&l.oldest_awaiting_minutes>l.backlog_minutes)warn.push(`${l.awaiting_evaluation.toLocaleString()} ended run${l.awaiting_evaluation===1?" is":"s are"} waiting to be evaluated, the oldest for ${l.oldest_awaiting_minutes} minutes. Is the evaluation sweep running? (An alert opens for this.)`);
  if(l.sweep&&!l.sweep.ok)warn.push(`The last evaluation sweep failed: ${l.sweep.error}`);
  if(l.evaluation_errors)warn.push(`${l.evaluation_errors.toLocaleString()} runs couldn't be evaluated; open one for the error. They're checked again when they get new data.`);
  return `<div class="panel stack"><div class="panel-head"><div><h2>Live agent runs</h2><p class="sub">Each run is checked when it ends: it finished, kept the path contracts, didn't loop, recovered from tool errors.</p></div></div>
    ${warn.map(w=>`<p class="flag"><span class="chip warn">evaluation</span>${esc(w)}</p>`).join("")}
    <div class="tiles">${tiles.map(([k,v,why])=>`<div class="tile"><b>${(v||0).toLocaleString()}</b><span>${k}<br><span class="ref">${why}</span></span></div>`).join("")}</div>
    ${l.recent_failures.length?`<details><summary class="note">Latest failing runs (${Math.min(15,l.recent_failures.length)})</summary><div class="scroll"><table><tr><th>Run</th><th>Task</th><th>Status</th><th>Failed</th><th>Evaluated</th></tr>
      ${l.recent_failures.slice(0,15).map(r=>`<tr class="click" data-traj="${esc(r.trajectory_id)}"><td class="mono">${esc(r.trajectory_id)}</td><td class="ref">${esc(r.task||"")}</td><td>${lifeStatus(r.status)}</td>
        <td>${Object.entries(r.failed.reduce((g,c)=>((g[c.reason||""]??=[]).push(LIFE_CHECK[c.check]||c.check),g),{}))
          .map(([why,checks])=>`<div><b>${esc([...new Set(checks)].join(", "))}</b> <span class="ref" title="${esc(why)}">${esc(why.length>140?why.slice(0,140)+"…":why)}</span></div>`).join("")}</td><td class="ref">${esc(r.evaluated_at.slice(0,16).replace("T"," "))}</td></tr>`).join("")}</table></div></details>`
      :`<p class="note">${l.evaluated?"No evaluated run failed a check.":"No run has ended yet."}</p>`}</div>`;
}
// Where runs broke: one line per place, in plain words, most first. Every count opens its runs. `agree` is
// the failing agent runs "What failed" counted: when the two disagree, the panel says so.
async function agentMatrix(el,run,baseline,agree){
  const m=await api(`/v1/agents/matrix?${q({source:src(),run,baseline})}`).catch(()=>null);
  if(!m){el.innerHTML="";return}
  if(!m.runs&&!m.baseline_failed){el.innerHTML=m.plain_left_out?`<h3 style="margin:14px 0 6px">Where runs broke</h3><p class="note">No agent runs here: all ${m.plain_left_out} are plain tests, judged by their own asserts (under Every run).</p>`:"";return}
  const left=m.plain_left_out?` ${m.plain_left_out} plain test${m.plain_left_out===1?"":"s"} left out: their own asserts judge them, under Every run.`:"";
  const now=m.cells.filter(c=>c.count).sort((a,b)=>m.baseline?(b.change||0)-(a.change||0)||b.count-a.count:b.count-a.count);
  const gone=m.cells.filter(c=>!c.count&&c.before);
  const open=id=>`<a href="#trace/${encodeURIComponent(id)}" class="mono">`;
  const ex=c=>c.runs.find(r=>r.detail);
  const row=(c,i)=>{const ch=m.baseline&&c.change?` <span class="${c.change>0?"worse":"better"}">${c.change>0?"+":""}${c.change}</span>`:"";
    const e=ex(c),more=c.runs.length-3;
    return`<tr><td class="num" style="white-space:nowrap"><b>${c.count}</b>${ch}</td>
      <td><b>${esc(c.sentence)}</b> <span class="ref">${esc(Object.entries(c.how).map(([h,n])=>c.count>1?`${h} ${n}`:h).join(", "))}</span>
        ${e?`<div class="ref">e.g. ${open(e.trajectory_id)}${esc(e.case)}</a>: ${esc(e.detail.length>200?e.detail.slice(0,200)+"…":e.detail)}</div>`:""}</td>
      <td><span id="mx-runs-${i}">${c.runs.slice(0,3).map(r=>`${open(r.trajectory_id)}${esc(r.case)}</a>`).join(", ")}</span>${more>0?` <button type="button" class="linkish" data-more="${i}">+${more} more</button>`:""}</td></tr>`};
  // The self-check: the runs placed here and the runs "What failed" counted are the same runs.
  let check="";
  if(agree){const here=new Set(now.flatMap(c=>c.runs.map(r=>r.trajectory_id))),there=new Set(agree.map(t=>t.trajectory_id));
    const extra=[...here].filter(id=>!there.has(id)),missing=agree.filter(t=>!here.has(t.trajectory_id));
    const list=xs=>xs.slice(0,5).map(t=>`${open(t.trajectory_id)}${esc(t.case_id||t.trajectory_id)}</a>`).join(", ")+(xs.length>5?` and ${xs.length-5} more`:"");
    if(extra.length)check+=`<p class="flag"><span class="chip bad">numbers disagree</span>${extra.length} run${extra.length===1?" is":"s are"} counted here but passed every check under What failed: ${list(extra.map(id=>({trajectory_id:id,case_id:now.flatMap(c=>c.runs).find(r=>r.trajectory_id===id).case})))}. One of the two is wrong, and it's a bug in Assay: please open an issue.</p>`;
    if(missing.length)check+=`<p class="note">${missing.length} failing run${missing.length===1?" has":"s have"} no line here: every checkpoint was met, or what failed (safety, a contract) isn't a step. ${list(missing)}</p>`}
  el.innerHTML=`<h3 style="margin:14px 0 6px">Where runs broke</h3>
    <p class="sub">Each line is a place agent runs broke: the last step that worked, then the first that went wrong (or the case's checkpoints, where it has them). ${m.failed} of ${m.runs} agent runs failed${m.baseline?`, against ${m.baseline_failed} in ${esc(m.baseline)}`:""}.${left}</p>
    ${check}
    ${now.length?`<div class="scroll"><table><tr><th class="num">Runs</th><th>What happened</th><th>Open one</th></tr>${now.map(row).join("")}</table></div>`:`<p class="note">No agent run failed.</p>`}
    ${gone.length?`<p class="note">No longer breaking since ${esc(m.baseline)}: ${gone.map(c=>`${esc(c.sentence)} <span class="better">(was ${c.before})</span>`).join(" · ")}</p>`:""}`;
  el.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const c=now[+b.dataset.more];
    $(`#mx-runs-${b.dataset.more}`).innerHTML=c.runs.map(r=>`${open(r.trajectory_id)}${esc(r.case)}</a>`).join(", ");b.remove()});
}

      :st.kind==="tool"?`<div class="call">${esc(callTxt(st.name,st.args))}${srv(st)}</div>${st.error?`<div class="res" style="color:var(--bad)">error: ${esc(st.error)}</div>`:st.result!=null?`<div class="res" title="${esc(jtxt(st.result))}">→ ${esc(jtxt(st.result).slice(0,220))}</div>`:""}`
      :st.kind==="state"?`<div class="call">${esc((st.args||{}).op||"update")} ${esc(st.name)}</div>${st.result!=null?`<div class="res">${esc(jtxt(st.result).slice(0,200))}</div>`:""}`
      :st.kind==="answer"?`<div>${esc(st.text||"")}</div>`

      :`<div class="res">${esc(st.model||"")}${st.tokens?` · ${st.tokens.toLocaleString()} tokens`:""}${st.tokens_in?` (${st.tokens_in.toLocaleString()} in)`:""}${(st.tools||[]).length?` · offered ${st.tools.length} tools`:""}${(st.tool_calls||[]).length?` · asked for ${st.tool_calls.map(c=>esc(c.name||"?")).join(", ")}`:""}${st.finish_reason&&st.finish_reason!=="stop"&&st.finish_reason!=="tool_call"?` · <b>stopped: ${esc(st.finish_reason)}</b>`:""}${st.cost_usd?` · ${money(st.cost_usd)}`:""}${st.text?` · ${esc(st.text.slice(0,120))}`:""}</div>`;
    const notes=[];

    if(r&&r.status==="error_retried")notes.push(`<span class="ref">errored, retried later</span>`);

    ${t.evaluation?`<div><h3 style="margin-bottom:6px">Checked when it ended ${lifeStatus(t.evaluation.status)} <span class="ref">${esc(t.evaluation.evaluated_at.slice(0,16).replace("T"," "))}</span></h3>
      ${t.evaluation.checks.map(c=>`<div><span class="okx ${c.status==="pass"?"y":"n"}">${c.status==="pass"?"✓":"✗"}</span> ${esc(LIFE_CHECK[c.check]||c.check)}${c.reason?` <span class="ref">${esc(c.reason)}</span>`:""}</div>`).join("")}</div>`:""}
    ${(t.recorded||[]).length?`<div><h3 style="margin-bottom:6px">Recorded checks <span class="ref">sent with the run: the test's own checks, judges</span></h3>
      ${t.recorded.map(c=>`<div><span class="okx ${c.status==="pass"?"y":"n"}">${c.status==="pass"?"✓":c.status==="fail"?"✗":"?"}</span> <span class="mono" style="font-size:12.5px">${esc(c.field)}</span>${c.reason?` <span class="ref">${esc(c.reason)}</span>`:""}</div>`).join("")}</div>`:""}
    ${fb?`<p class="flag"><span class="chip bad">first bad step</span><span><b>${esc(MECH[fb.mechanism][0])}</b>${fb.seq!=null?` at step ${fb.seq+1}`:""}: ${esc(fb.detail)}</span></p>`:""}
    <div class="traj"><div class="steps">${t.steps.map(stepHtml).join("")}</div>
      <div class="stack" style="align-content:start">
        ${ref?`<div><h3 style="margin-bottom:6px">Expected tool calls</h3>${(cmp?.expected||[]).map(x=>`<div class="flag"><span class="okx ${x.matched!=null?"y":"n"}">${x.matched!=null?"✓":"✗"}</span><span class="mono" style="font-size:12.5px">${esc(callTxt(x.tool,x.args))}</span>${x.optional?` <span class="ref">optional</span>`:""}${x.matched!=null?` <span class="ref">step ${x.matched+1}</span>`:` <span class="ref">missing</span>`}</div>`).join("")||`<p class="note">None listed.</p>`}
          ${cmp?`<p class="ref">precision ${pct(cmp.precision,0)} · recall ${pct(cmp.recall,0)} · ${cmp.in_order?"in order":"out of order"}</p>`:""}</div>
        ${t.end_state?`<div><h3 style="margin-bottom:6px">End state</h3>${t.end_state.map(a=>`<div class="flag"><span class="okx ${a.passed?"y":"n"}">${a.passed?"✓":"✗"}</span><span><span class="mono" style="font-size:12.5px">${esc(a.assertion)}</span>${a.passed?"":` <span class="ref">got ${esc(a.got)}</span>`}</span></div>`).join("")}</div>`:""}
        ${ref.answer?`<div><h3 style="margin-bottom:6px">Answer</h3><div class="flag"><span class="okx ${t.answer_ok?"y":"n"}">${t.answer_ok?"✓":"✗"}</span><span>should ${ref.answer_match==="equals"?"be":"include"} <b>${esc(ref.answer)}</b></span></div></div>`:""}`
        :`<p class="note">No reference for this case, so only contracts and efficiency are checked. Send one to <code>POST /v1/agents/references</code>.</p>`}
        ${Object.keys(world).length?`<div><h3 style="margin-bottom:6px">World afterwards</h3>${Object.entries(world).map(([k,v])=>`<div class="res mono" style="font-size:12px">${esc(k)}: ${v.deleted?`<span class="worse">deleted</span>`:esc(jtxt(v.state).slice(0,140))}</div>`).join("")}</div>`:""}
        <div><h3 style="margin-bottom:6px">Efficiency</h3><dl class="facts">
          <div><dt>Steps</dt><dd>${e.steps}${e.budget?` / ${e.budget}`:""}</dd></div><div><dt>Tool calls</dt><dd>${e.tool_calls}</dd></div>

      </div></div></div>`;
}

function saturationLine(t){
  if(!t||!t.reviewed)return`<span class="note">Nothing read by a person yet. A round is about ${t?t.pool:100} diverse conversations.</span>`;
  const bar=`<span class="track" style="display:inline-block;width:120px;vertical-align:middle"><span class="fill" style="width:${Math.min(100,t.reviewed/t.pool*100)}%"></span></span>`;
  return`<span>${bar} <b>${t.reviewed}</b> of a ${t.pool}-conversation pool read. `+(t.saturated?`The last ${t.window} found no new failure mode: <b>saturated</b>.`
    :t.window<t.of?`Saturation is checked over the last ${t.of}.`
    :`The last ${t.window}: ${t.new_modes} new failure mode${t.new_modes===1?"":"s"}, ${t.changed} changed, ${t.ungrouped} not grouped yet. Keep reading.`)+`</span>`}

    :`<li><b class="mono">${esc(e.name)}</b> ${e.severity?`<span class="chip ${SEV[e.severity]}">${esc(e.severity)}</span>`:""}
      ${e.flow_change?`<div class="mono ref">Expected: ${esc((e.expected||[]).join(" → ")||"(no calls)")}${tr(e.trace_before)}</div>

const CALL={advance:["good","Advance"],rerun:["warn","Rerun"],hold:["warn","Hold"],rollback:["bad","Roll back"]};
// One verdict per check (assay/verdicts.py): only FAIL is about the AI.
const EVAL_VERDICT=[["PASS","Passed","good"],["FAIL","Failed","bad"],["FLAKY","Flaky","warn"],["INCONCLUSIVE","Inconclusive","warn"],["JUDGE_UNSTABLE","Judge unstable","warn"],
  ["INVALID","Invalid result","neutral"],["TIMEOUT","Timed out","neutral"],["RATE_LIMITED","Rate limited","neutral"],
  ["EVALUATOR_ERROR","Evaluator error","neutral"],["INFRA_ERROR","Infra error","neutral"],["MISSING","Missing","neutral"]];
const verdictRow=v=>v?`<div class="tiles">${EVAL_VERDICT.map(([k,l,c])=>`<div class="tile"><b>${(v[k]||0).toLocaleString()}</b><span><span class="chip ${c}">${l}</span></span></div>`).join("")}</div>
  <p class="note">Only <b>failed</b> says something about the AI. Evaluator errors, infrastructure errors and missing results mean the check didn't happen; inconclusive means it hasn't settled. <code>GET /v1/evals/runs/{run}/verdicts</code> lists every check.</p>`:"";
function rateCell(p,n,lo,hi){return n?`${p}/${n}${lo!=null?` <span class="ref">${pct(lo,0)}–${pct(hi,0)}</span>`:""}`:"—"}
function releaseCall(st,sc){

    <div class="call"><span class="chip ${cls}">${label}</span>${c?`<span>Pass rate ${c.point<=0?"down":"up"} <b>${pct(Math.abs(c.point))}</b> <span class="ref">95% interval ${c.point<=0?`${pct(Math.max(0,-c.high))} to ${pct(-c.low)} lower`:`${pct(c.low)} to ${pct(c.high)}`} · attempt noise ±${pct(st.noise||0)} · ${c.checks.toLocaleString()} checks counted</span></span>`:""}
      <button type="button" id="gate-record">Record as gate decision</button></div>
    <ul style="margin:0;padding-left:18px">${st.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>

      ${Object.entries(st.roles||{}).filter(([,n])=>n).length?`<span class="ref">Not counted:</span>${Object.entries(st.roles).filter(([,n])=>n).map(([k,n])=>`<span><b>${n.toLocaleString()}</b>&nbsp;${esc({accepted:"decided",intended:"intended change",evaluator:"evaluator",evaluator_input:"wrong evaluator data",infrastructure:"infrastructure"}[k]||k)}</span>`).join("")}`:""}</div>
    ${st.got_worse.length?`<details><summary>Got worse beyond chance · ${st.got_worse.length}</summary><div class="scroll"><table><tr><th>Case</th><th>Field</th><th>Evaluator</th><th>Attempts</th><th class="num">Before</th><th class="num">Now</th><th class="num">q</th></tr>
      ${st.got_worse.slice(0,60).map(r=>row(r)+`<td class="num">${r.q_worse!=null?r.q_worse.toFixed(3):"—"}</td></tr>`).join("")}</table></div></details>`:""}
    ${st.reruns.length?`<details ${st.outcome==="rerun"?"open":""}><summary>Rerun before judging · ${st.reruns.length} checks, ${st.reruns.reduce((a,r)=>a+(r.reruns||0),0).toLocaleString()} attempts <button class="link" type="button" id="rerun-copy">copy as JSON</button></summary><div class="scroll"><table><tr><th>Case</th><th>Field</th><th>Evaluator</th><th>Attempts</th><th class="num">Before</th><th class="num">Now</th><th>Why</th><th class="num">More</th></tr>
      ${st.reruns.slice(0,60).map(r=>row(r)+`<td class="ref">${esc(r.why)}</td><td class="num">${r.reruns??"—"}</td></tr>`).join("")}</table></div></details>`:""}
    ${st.flaky.length?`<details><summary>Flaky · ${st.flaky.length} checks, counted by pass rate, not blocking</summary><div class="scroll"><table><tr><th>Case</th><th>Field</th><th>Evaluator</th><th>Attempts</th><th class="num">Before</th><th class="num">Now</th><th>What varies</th></tr>
      ${st.flaky.slice(0,60).map(r=>row(r)+`<td class="ref">${esc({output:"the output",evaluator:"only the verdict",infrastructure:"attempts errored"}[r.flake]||"—")}</td></tr>`).join("")}</table></div></details>`:""}
  </div>`;
}
function causeCard(g,sc){
  const [kl,kc]=KIND[g.kind],d=g.decision;
  const reg=(g.regression===true?`<span class="chip bad">regression</span>`:g.regression===false?`<span class="chip neutral">${g.flaky_checks?"flaky, no worse":"long-standing"}</span>`:"")
    +(g.flaky_checks&&g.regression!==false?`<span class="chip warn">${g.flaky_checks} flaky</span>`:"");
  const conf=`<span class="chip ${g.confidence==="high"?"good":g.confidence==="moderate"?"warn":"neutral"}" title="How consistently the evidence points to this kind">${esc(g.confidence)} confidence</span>`;
  const trace=x=>x.document_id?`<a class="mono" href="#trace/${encodeURIComponent(x.document_id)}${x.origin_stage?"/"+encodeURIComponent(x.origin_stage):""}">${esc(x.case_id||x.document_id)}</a>`:esc(x.case_id);
  const exportLink=sc.kind==="eval"&&(g.kind==="intended_change"||g.kind==="evaluator")?` · <a href="/v1/evals/runs/${encodeURIComponent(sc.run_id)}/expectations?${q({source:src(),key:g.key})}" target="_blank" rel="noopener">new expected values (JSON)</a>`:"";
  const acts=d?`<span class="chip ${d.decision==="confirmed"?"warn":"good"}">${esc(DECISION[d.decision])}</span><span class="ref">${esc(ago(d.decided_at))}${d.decided_by?" by "+esc(d.decided_by):""}</span><button class="link" type="button" data-decide="" data-key="${esc(g.key)}">Undo</button>${d.decision==="accepted_change"?exportLink:""}`
    :`${g.kind==="intended_change"?`<button class="primary" type="button" data-decide="accepted_change" data-key="${esc(g.key)}">Accept as intended</button>`:""}
      ${g.kind!=="intended_change"&&!g.small?`<button type="button" data-decide="confirmed" data-key="${esc(g.key)}">Confirm and fix</button>`:""}
      <button class="link" type="button" data-decide="not_a_problem" data-key="${esc(g.key)}">Not a problem</button>${g.kind==="intended_change"?exportLink:""}`;
  return `<div class="cause ${d&&d.decision!=="confirmed"?"decided":""}"><span class="stripe" style="background:${kc}"></span><div>
    <div class="head"><span class="chip" style="color:#fff;background:${kc}">${esc(kl)}</span>${reg}${conf}
      <span class="count">${g.failures.toLocaleString()}<small>${pct(g.share,0)}</small></span></div>
    <h3>${esc(g.name)}</h3>
    ${g.evidence.length?`<ul>${g.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}
    ${g.distinguishing.length?`<div><span class="ref">Sets these apart from passing cases:</span> ${g.distinguishing.map(featLabel).join("")}</div>`:""}
    <div class="meta" style="margin-top:4px">${Object.entries(g.fields).map(([f,n])=>`${esc(f)} ${n}`).join(" · ")}${g.new!=null?` · ${g.new} new, ${g.persisting} already failing`:""}</div>
    <details style="margin-top:6px"><summary class="ref">Examples</summary><div class="scroll"><table style="margin-top:6px"><tr><th>Case</th><th>Field</th><th>Expected</th><th>Got</th><th>How</th><th>Started at</th>${sc.kind==="eval"?"<th>Attempts</th>":""}</tr>
      ${g.examples.map(x=>`<tr><td>${trace(x)}</td><td class="mono">${esc(x.field||"—")}</td><td>${esc(x.expected??"—")}</td><td>${esc(x.actual??"—")}</td><td class="ref">${esc(x.how||x.shape)}${x.reason&&x.reason!=="values differ"?`<br>${esc(x.reason.slice(0,90))}`:""}</td><td class="mono">${esc(x.origin_stage||"—")}</td>${x.check?`<td class="dots" title="${x.check.passed} of ${x.check.attempts} passed${x.check.base_attempts?`; before: ${x.check.base_passed} of ${x.check.base_attempts}`:""}">${esc(x.check.outcomes)}</td>`:""}</tr>`).join("")}</table></div></details>
    <div class="acts">${acts}</div></div></div>`;
}

/* ---------- path contracts ---------- */
const CKINDS={must_include:"Every document runs a step",never:"A step never runs",before:"A step runs before another",
  only_after:"A step runs only after another",max_runs:"A step runs at most N times",allowed_steps:"Only listed steps run"};
const CSTATE={broken:["bad","broken"],kept:["good","kept"],unjudged:["neutral","not checked"]};
async function renderContracts(g,days){
  const box=$("#wf-contracts");if(!box)return;
  const [rep,sh]=await Promise.all([api(`/v1/contracts?${q({source:src(),days})}`).catch(e=>({error:e.message,contracts:[]})),
    api(`/v1/contracts/shifts?${q({source:src(),days})}`).catch(()=>null)]);
  const steps=g.nodes.filter(n=>!n.kind).map(n=>n.id);
  const docLink=e=>`<a class="mono" href="#trace/${encodeURIComponent(e.document_id)}/${encodeURIComponent(e.stage)}" title="${esc(e.path.join(" → "))}">${esc(e.document_id)}</a>`;
  box.innerHTML=`<div class="panel stack">
    <div class="panel-head"><div><h2>Path contracts</h2><p class="sub">Rules about the steps a document may take, checked on every document. One break opens an alert right away. A change that breaks no rule, like a retry or a new branch, doesn't.</p></div>
      <button type="button" id="ct-suggest">Suggest from traffic</button></div>
    <div id="ct-suggestions"></div>
    <div>${rep.contracts.length?rep.contracts.map(c=>{const [cls,lbl]=CSTATE[c.state];return `<div class="contract">
      <span><span class="chip ${c.state==="broken"&&c.severity==="warning"?"warn":cls}">${lbl}</span></span>
      <div><div class="msg">${esc(c.label)}${c.severity==="warning"?` <span class="ref">· warning</span>`:""}</div>
        <div class="meta">${c.state==="broken"?`${c.violations.toLocaleString()} of ${c.judged.toLocaleString()} documents (${pct(c.rate)})`:`${c.judged.toLocaleString()} documents checked`}${c.note?` · ${esc(c.note)}`:""}</div>
        ${c.examples.length?`<div class="meta">${esc(c.examples[0].detail)}: ${c.examples.slice(0,8).map(docLink).join(" · ")}${c.violations>8?" …":""}</div>`:""}</div>
      <button class="link" type="button" data-del-contract="${c.id}">Remove</button></div>`}).join("")
      :`<p class="note">${esc(rep.error||"No contracts yet. Add one below, or let Assay suggest the ones current traffic already keeps.")}</p>`}</div>
    <details ${rep.contracts.length?"":"open"}><summary>Add a contract</summary>${contractForm(steps)}</details>
  </div>
  ${sh?`<div class="panel stack"><div class="panel-head"><div><h2>Path shifts</h2><p class="sub">How paths changed compared with the ${days} day${days>1?"s":""} before. None of these breaks a contract, so nobody is paged. If a shift is expected, leave it; if it shouldn't happen, add a contract.</p></div></div>
    ${sh.shifts.length?`<div class="flags">${sh.shifts.map(x=>`<div class="flag"><span class="chip ${x.kind==="share"?"neutral":"warn"}">${esc(x.kind.replace("_"," "))}</span>${esc(x.message)}</div>`).join("")}</div>`:`<p class="note">${esc(sh.note||"No change beyond noise.")}</p>`}</div>`:""}`;
  wireContracts(g,days);
}

function wireContracts(g,days){
  const f=$("#ct-form"),again=()=>renderWorkflow();
  const kindUI=()=>{const k=$("#ct-kind").value;
    $("#ct-step").hidden=k==="allowed_steps";$("#ct-list").hidden=k!=="allowed_steps";
    $("#ct-other-w").hidden=!["before","only_after"].includes(k);$("#ct-same-w").hidden=!["before","only_after"].includes(k);
    $("#ct-max-w").hidden=k!=="max_runs";$("#ct-where").hidden=k==="allowed_steps"};
  if(f){$("#ct-kind").onchange=kindUI;kindUI();
    $("#ct-scope").onchange=()=>{$("#ct-scope-w").hidden=!$("#ct-scope").value};
    f.onsubmit=async e=>{e.preventDefault();const k=$("#ct-kind").value,sc=$("#ct-scope").value;
      const list=v=>v.split(",").map(x=>x.trim()).filter(Boolean);
      const body={source:src(),kind:k,severity:$("#ct-sev").value,note:$("#ct-note").value||null,
        step:k==="allowed_steps"?null:$("#ct-step").value.trim(),other:$("#ct-other").value.trim()||null,
        max_runs:k==="max_runs"?+$("#ct-max").value:null,steps:k==="allowed_steps"?list($("#ct-list").value):null};
      if(sc)body[sc]={[$("#ct-field").value]:list($("#ct-values").value)};
      const val=v=>v==="true"?true:v==="false"?false:v!==""&&!isNaN(+v)?+v:v;
      const where={};list($("#ct-where").value).forEach(c=>{const m=c.match(/^([\w.]+)\s*(!=|=)\s*(.*)$/);if(m)where[m[1]]=m[2]==="!="?{not:val(m[3])}:val(m[3])});
      if(Object.keys(where).length)body.where=where;
      if(["before","only_after"].includes(k)&&$("#ct-same").value.trim())body.same=list($("#ct-same").value);
      if(k==="max_runs"&&$("#ct-ident").checked)body.identical=true;
      try{await api("/v1/contracts",{method:"POST",body:JSON.stringify(body)});again()}
      catch(err){$("#ct-msg").textContent=err.message}}}
  document.querySelectorAll("[data-del-contract]").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Remove? Click again";b.classList.add("worse");return}

  $("#ct-suggest").onclick=async()=>{const box=$("#ct-suggestions"),b=$("#ct-suggest");b.disabled=true;b.textContent="Reading paths…";
    try{const r=await api(`/v1/contracts/suggestions?${q({source:src(),days:30})}`);
      if(!r.suggestions.length){box.innerHTML=`<p class="note">${esc(r.note||"Nothing to add: your contracts already cover what the last 30 days of paths keep.")}</p>`;return}
      box.innerHTML=`<div class="suggest"><div class="panel-head"><div><h3>Suggested from ${r.documents.toLocaleString()} finished documents (30 days)</h3>
        <p class="sub">What current paths already keep, ignoring documents that break your contracts. Add the ones that are real rules, not coincidences.</p></div>
        <button type="button" id="ct-addall">Add all</button></div>
        ${r.suggestions.map((x,i)=>`<div class="flag"><button class="link" type="button" data-sugg="${i}">Add</button><span>${esc(x.label)} <span class="ref">${pct(x.kept_rate,1)} keep it · ${esc(x.severity)}</span></span></div>`).join("")}</div>`;
      const add=x=>api("/v1/contracts",{method:"POST",body:JSON.stringify({source:src(),...Object.fromEntries(
        ["kind","step","other","max_runs","steps","severity"].map(k=>[k,x[k]??null]))})});
      box.querySelectorAll("[data-sugg]").forEach(el=>el.onclick=async()=>{el.disabled=true;
        try{await add(r.suggestions[+el.dataset.sugg]);el.textContent="Added"}catch(e){el.textContent=e.message}});
      $("#ct-addall").onclick=async()=>{for(const x of r.suggestions)await add(x).catch(()=>null);again()};
    }catch(e){box.innerHTML=`<p class="reason">${esc(e.message)}</p>`}

  <div class="panel stack">
    <div class="panel-head"><div><h2>Trace a document</h2><p class="sub">Follow one document through every stage and model call, with what went wrong flagged.</p></div>
      <form id="find" class="picker"><input id="docid" placeholder="Document ID" aria-label="Document ID" value="${esc(T.doc||"")}"><button type="submit">Trace</button></form></div>
