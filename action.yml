name: Assay AI regression test
description: >-
  Run your AI tests with Assay, compare every test with its last passing run on the default branch,
  and say what changed on the pull request.
branding:
  icon: check-circle
  color: blue

inputs:
  command:
    description: The test command. `pytest --assay` compares each test with its baseline.
    default: pytest --assay
  install:
    description: Installs what the tests need, Assay included (skip it if an earlier step does).
    default: pip install assay-server pytest
  timeout:
    description: >-
      Seconds before a hung test run is stopped (a test that never returns, or a process that
      won't exit). What it recorded is still judged. Empty uses assay.toml's timeout.
    default: ""
  comment:
    description: Post the summary on the pull request, updating Assay's earlier comment.
    default: "true"
  fail-on-inconclusive:
    description: Fail the job when nothing got worse but some results couldn't be judged, or need more attempts to tell.
    default: "true"
  token:
    description: "For the PR comment: needs `pull-requests: write`."
    default: ${{ github.token }}
  trusted-policy:
    description: >-
      On a pull request, hold the checks (contracts, [pii], [behavior], tolerance) to the base
      branch's assay.toml, so a PR can't loosen the checks that judge it. Loosening them fails
      the run unless the PR has the policy-label.
    default: "true"
  config:
    description: Where assay.toml is, from the repository root.
    default: assay.toml
  policy-label:
    description: The PR label that accepts a change that loosens the checks.
    default: assay-policy-change

outputs:
  result:
    description: passed, regressed, inconclusive or error
    value: ${{ steps.test.outputs.result }}

runs:
  using: composite
  steps:
    # pull_request_target runs with a write token and the repository's secrets. Checking out and
    # running a PR's code there hands both to whoever opened the PR.
    - if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::Don't run Assay under pull_request_target: it would run the PR's code with write access and secrets. Use pull_request."
        exit 1

    # The checks come from the base branch, not the PR (see trusted-policy).
    - if: github.event_name == 'pull_request' && inputs.trusted-policy == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        CONFIG: ${{ inputs.config }}
        ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, inputs.policy-label) }}
      run: |
        git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF" >/dev/null 2>&1 || true
        if git show "FETCH_HEAD:$CONFIG" > "$RUNNER_TEMP/assay.base.toml" 2>/dev/null; then
          echo "ASSAY_POLICY=$RUNNER_TEMP/assay.base.toml" >> "$GITHUB_ENV"
          # Its acknowledged failures too: one the PR adds is held back unless the label accepts it.
          git show "FETCH_HEAD:${CONFIG%.toml}.acks.toml" > "$RUNNER_TEMP/assay.base.acks.toml" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/assay.base.acks.toml"
        else
          echo "::notice::No $CONFIG on $BASE_REF yet: this PR's checks are used as they are."
          echo "ASSAY_POLICY=$RUNNER_TEMP/assay.none.toml" >> "$GITHUB_ENV"
        fi
        if [ "$ACCEPTED" = "true" ]; then echo "ASSAY_POLICY_CHANGE=accepted" >> "$GITHUB_ENV"; fi

    # Baselines live in .assay/, which isn't in git. The default branch saves them to the cache;
    # a pull request restores its base branch's latest, so it's compared with what's on main.
    - uses: actions/cache/restore@v4
      with:
        path: |
          .assay/assay.db
          .assay/state.json
        key: assay-baseline-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
        restore-keys: assay-baseline-${{ github.base_ref || github.ref_name }}-

    - if: inputs.install != ''
      shell: bash
      run: ${{ inputs.install }}

    - id: test
      shell: bash
      env:
        ASSAY_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set +e
        ${{ inputs.command }}
        code=$?
        case $code in
          0) result=passed ;;
          1) result=regressed ;;
          3|6) result=inconclusive ;;
          *) result=error ;;
        esac
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "result=$result" >> "$GITHUB_OUTPUT"

    - if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      # A PR from a fork gets a read-only token: say so, don't fail the job over the comment.
      run: assay pr-comment || echo "::warning::Assay couldn't comment on the PR (a fork's token is read-only)."

    - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v4
      with:
        path: |
          .assay/assay.db
          .assay/state.json
        key: assay-baseline-${{ github.ref_name }}-${{ github.run_id }}

    - shell: bash
      run: |
        case "${{ steps.test.outputs.result }}" in
          passed) exit 0 ;;
          inconclusive) [ "${{ inputs.fail-on-inconclusive }}" = "true" ] && exit 1 || exit 0 ;;
          *) exit 1 ;;
        esac
