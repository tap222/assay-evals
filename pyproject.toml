[project]
name = "assay-server"
version = "0.2.0"
description = "Assay server: evaluation and observability for AI pipelines and agents, with a dashboard and demo data"
readme = "docs/assay-server.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tap222" }]
requires-python = ">=3.10"
keywords = ["llm", "evals", "pytest", "regression-testing", "agents", "evaluation", "ci", "document-ai", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "tomli>=2; python_version < '3.11'",
  "assay-evals",  # the SDK. Not pinned >=0.2.0 until it is on PyPI: `assay test` checks the version itself
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
judge = ["anthropic"]  # the LLM judge (assay/judge.py): plan quality and consistency
sso = ["pyjwt[crypto]>=2.8"]  # single sign-on (assay/sso.py): verifying the provider's ID tokens
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/tap222/assay-evals"
Documentation = "https://github.com/tap222/assay-evals/blob/main/docs/setup.md"
Issues = "https://github.com/tap222/assay-evals/issues"

[project.scripts]
assay = "assay.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assay*"]

[tool.setuptools.package-data]
assay = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
