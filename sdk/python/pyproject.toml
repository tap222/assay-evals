[project]
name = "assay-evals"
version = "0.2.0"
description = "Record what your AI system does, and how it went, in Assay: runs, agent steps, feedback and test results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tap222" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "evals", "pytest", "regression-testing", "agents", "evaluation", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tap222/assay-evals"
Documentation = "https://github.com/tap222/assay-evals/tree/main/sdk/python#readme"
"Event schema" = "https://github.com/tap222/assay-evals/blob/main/docs/event-schema.md"
Issues = "https://github.com/tap222/assay-evals/issues"

[project.entry-points.pytest11]
assay = "assay_sdk.pytest_plugin"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assay_sdk"]

[tool.setuptools.package-data]
assay_sdk = ["py.typed"]
